        vin:
          type: string
          nullable: true
          description: "Fahrgestellnummer, max. 17 Zeichen"
        firstRegistration:
          type: string
          format: date
          nullable: true
          description: "Erstzulassung; ohne TÜV-Eintrag erster TÜV nach 36 Monaten"
        purchaseDate:
          type: string
          format: date
          nullable: true
        purchasePrice:
          type: number
          nullable: true
        saleDate:
          type: string
          format: date
          nullable: true
        salePrice:
          type: number
          nullable: true
        serviceIntervalMonths:
          type: integer
          nullable: true
          description: "1–60, Standard 12"
        serviceIntervalKm:
          type: integer
          nullable: true
          description: "1.000–100.000, Standard 15.000"
        oilIntervalMonths:
          type: integer
          nullable: true
          description: "1–60"
        oilIntervalKm:
          type: integer
          nullable: true
          description: "1.000–100.000"
        insuranceCompany:
          type: string
          nullable: true
        insurancePremium:
          type: number
          nullable: true
          description: "Beitrag pro Jahr"
        insuranceDueMonth:
          type: integer
          nullable: true
          description: "1–12"
        taxAmount:
          type: number
          nullable: true
          description: "pro Jahr"
        taxDueMonth:
          type: integer
          nullable: true
          description: "1–12"
        tireSizeSummer:
          type: string
          nullable: true
        tireSizeWinter:
          type: string
          nullable: true

    Vehicle:
      type: object
