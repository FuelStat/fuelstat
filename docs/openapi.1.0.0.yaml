          format: uuid
        name:
          type: string
        fuel_type:
          $ref: "#/components/schemas/VehicleFuelType"
        tank_capacity:
          type: number
          nullable: true
        battery_capacity:
          type: number
          nullable: true
          description: Nur Plug-in-Hybride
        license_plate:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        first_registration:
          type: string
          format: date
          nullable: true
        purchase_date:
          type: string
          format: date
          nullable: true
        purchase_price:
          type: number
          nullable: true
        sale_date:
          type: string
          format: date
          nullable: true
        sale_price:
          type: number
          nullable: true
        service_interval_months:
          type: integer
          nullable: true
        service_interval_km:
          type: integer
          nullable: true
        oil_interval_months:
          type: integer
          nullable: true
        oil_interval_km:
          type: integer
          nullable: true
        insurance_company:
          type: string
          nullable: true
        insurance_premium:
          type: number
          nullable: true
        insurance_due_month:
          type: integer
          nullable: true
        tax_amount:
