          nullable: true
        tire_size_winter:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, name, fuel_type]

    VehicleListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Vehicle"

    FillupUnit:
      type: string
      description: Einheit der Menge (Verbrenner l, Elektro kWh, CNG/Wasserstoff kg; Plug-in-Hybride l beim Tanken, kWh beim Laden).
      enum: [l, kwh, kg]

    FillupCreateRequest:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: string
          format: uuid
        odometerKm:
          type: integer
          minimum: 0
          nullable: true
          description: Optional – fehlt er, kann er später per PATCH nachgetragen werden (auch nach 14 Tagen)
        odometerEstimated:
          type: boolean
          default: false
          description: Wert ist nur geschätzt (Platzhalter); zählt nicht für Verbrauch und Tachostand
        unit:
          $ref: "#/components/schemas/FillupUnit"
          description: Optional, wird aus vehicle.fuel_type abgeleitet wenn nicht gesetzt (Plug-in-Hybrid ohne Angabe = l)
        amount:
          type: number
          minimum: 0
          description: "Backward-kompatibel: kann auch als 'liters' gesendet werden"
        liters:
          type: number
          minimum: 0
          description: Alias für amount (Backward-Kompatibilität)
        totalCostEur:
          type: number
          minimum: 0
          description: "Backward-kompatibel: kann auch als 'priceTotalEur' gesendet werden"
        priceTotalEur:
          type: number
          minimum: 0
          description: Alias für totalCostEur (Backward-Kompatibilität)
        station:
          type: string
          nullable: true
        filledAt:
          type: string
          format: date-time
          nullable: true
          description: Wenn nicht gesetzt, wird now() verwendet
        isFull:
          type: boolean
          default: true
        skipPrevious:
          type: boolean
          default: false
      required: [vehicleId]

    FillupPatchRequest:
      type: object
      additionalProperties: false
      description: Nur innerhalb von 14 Tagen nach filled_at – außer der Body enthält ausschließlich odometerKm und odometerEstimated (Tachostand nachtragen)
      properties:
        odometerKm:
          type: integer
          minimum: 0
          nullable: true
          description: null entfernt den Tachostand
        odometerEstimated:
          type: boolean
          description: Ohne Angabe gilt ein neu gesetzter Tachostand als echt
        unit:
          $ref: "#/components/schemas/FillupUnit"
        amount:
          type: number
          minimum: 0
          description: "Backward-kompatibel: kann auch als 'liters' gesendet werden"
        liters:
          type: number
          minimum: 0
          description: Alias für amount (Backward-Kompatibilität)
        totalCostEur:
          type: number
          minimum: 0
          description: "Backward-kompatibel: kann auch als 'priceTotalEur' gesendet werden"
        priceTotalEur:
          type: number
          minimum: 0
          description: Alias für totalCostEur (Backward-Kompatibilität)
        station:
          type: string
          nullable: true
        filledAt:
          type: string
          format: date-time
          nullable: true
        isFull:
          type: boolean
        skipPrevious:
          type: boolean

    OdometerWarning:
      type: object
      properties:
        code:
          type: string
          enum: [lower_than_previous, higher_than_next, jump, below_purchase]
        message:
          type: string
        refDate:
          type: string
          format: date
        refKm:
          type: integer

    Fillup:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        odometer_km:
          type: integer
          nullable: true
          description: null = Tachostand fehlt
        odometer_estimated:
          type: boolean
          description: Tachostand ist nur geschätzt
        warnings:
          type: array
          description: Nur bei POST/PATCH – Hinweise auf einen unplausiblen Tachostand (gespeichert wird trotzdem)
          items:
            $ref: "#/components/schemas/OdometerWarning"
        unit:
          $ref: "#/components/schemas/FillupUnit"
        amount:
          type: number
        total_cost_eur:
          type: number
        price_per_unit:
          type: number
          nullable: true
        station:
          type: string
          nullable: true
        filled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        is_full:
          type: boolean
        skip_previous:
          type: boolean
        # Legacy-Felder für Backward-Kompatibilität (nur bei unit='l')
        liters:
          type: number
          nullable: true
          description: Alias für amount, nur gesetzt wenn unit='l'
        price_total_eur:
          type: number
          nullable: true
          description: Alias für total_cost_eur
        price_per_liter:
          type: number
          nullable: true
          description: Alias für price_per_unit, nur gesetzt wenn unit='l'
      required: [id, vehicle_id, odometer_km, unit, amount, total_cost_eur, filled_at, created_at, is_full, skip_previous]

    FillupListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Fillup"

    VehicleStatsSegment:
      type: object
      additionalProperties: false
      properties:
        full_id:
          type: string
          format: uuid
        full_at:
          type: string
          format: date-time
        unit:
          $ref: "#/components/schemas/FillupUnit"
          description: Abschnitte laufen je Einheit von voller Füllung zu voller Füllung (Plug-in-Hybrid getrennt für l und kWh)
        km:
          type: integer
          minimum: 0
        liters_segment:
          type: number
          minimum: 0
          description: Verbrauchte Menge im Segment (kann Liter, kWh oder kg sein)
        l_per_100km:
          type: number
          nullable: true
          description: Verbrauch je 100km (z.B. l/100km oder kWh/100km). Null wenn km=0.
      required: [full_id, full_at, km, liters_segment]

    VehicleStatsTrend:
      type: object
      additionalProperties: false
      properties:
        current:
          type: number
        avgPrev:
          type: number
        diff:
          type: number
      required: [current, avgPrev, diff]

    CostSums:
      type: object
      properties:
        energy: { type: number, description: "Tank- und Ladevorgänge, EUR" }
        expenses: { type: number, description: "Ausgaben, die als Kosten zählen, EUR" }
        total: { type: number, description: EUR }

    VehicleStatsResponse:
      type: object
      additionalProperties: false
      properties:
        currentOdo:
          type: integer
          nullable: true
        avgPricePerLiter:
          type: number
          nullable: true
          description: Durchschnittlicher Preis pro Einheit des Fahrzeugs (Liter/kWh/kg; Plug-in-Hybrid Liter)
        missingOdometer:
          type: integer
          description: Anzahl Tank-/Ladevorgänge ohne echten Tachostand (fehlt oder geschätzt)
        distance:
          type: object
          nullable: true
          description: Gefahrene km seit Anschaffung (since=purchase) bzw. seit dem ersten echten Tachostand (since=firstEntry)
          properties:
            km: { type: integer }
            since: { type: string, enum: [purchase, firstEntry] }
        avgConsumption:
          type: number
          nullable: true
          description: Ø Verbrauch pro 100 km über alle Abschnitte (nach km gewichtet) in der Einheit des Fahrzeugs; trend.current ist nur der letzte Abschnitt
        segments:
          type: array
          items:
            $ref: "#/components/schemas/VehicleStatsSegment"
        trend:
          $ref: "#/components/schemas/VehicleStatsTrend"
          nullable: true
        units:
          type: object
          description: "Ø Preis, Ø Verbrauch und Trend je vorhandener Einheit, z. B. { l: {...}, kwh: {...} } beim Plug-in-Hybrid"
          additionalProperties:
            type: object
            properties:
              avgPrice:
                type: number
                nullable: true
              avgConsumption:
                type: number
                nullable: true
                description: Ø Verbrauch pro 100 km über alle Abschnitte (nach km gewichtet)
              trend:
                $ref: "#/components/schemas/VehicleStatsTrend"
                nullable: true
      required: [segments]

    EntryCategory:
      type: string
      description: >
        Kategorie für generische Einträge (Expenses/Entries). Freier Text.
        Typische Werte: repair, insurance, tuv, tax, maintenance, tires, etc.

    EntryCreateRequest:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/EntryCategory"
        amountEur:
          type: number
          minimum: 0
        odometerKm:
          type: integer
          minimum: 0
          nullable: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: Wenn nicht gesetzt, wird now() verwendet
        vendor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      required: [vehicleId, category, amountEur]

    Entry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/EntryCategory"
        amount_eur:
          type: number
        odometer_km:
          type: integer
          nullable: true
        occurred_at:
          type: string
          format: date-time
        vendor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, vehicle_id, category, amount_eur, occurred_at, created_at]

    EntryPatchRequest:
      type: object
      additionalProperties: false
      description: Alle Felder optional; nur gesendete Felder werden geändert
      properties:
        category:
          $ref: "#/components/schemas/EntryCategory"
        amountEur:
          type: number
          minimum: 0
        odometerKm:
          type: integer
          minimum: 0
          nullable: true
        occurredAt:
          type: string
          format: date-time
        vendor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]

    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32-Secret für die Authenticator-App
        otpauthUrl:
          type: string
          description: otpauth://-URL für den QR-Code

    MfaCodeRequest:
      type: object
      properties:
        code:
          type: string
          example: "123456"
        password:
          type: string
          description: Nur bei /auth/mfa/disable erforderlich
      required: [code]

    Reminder:
      type: object
      properties:
        title: { type: string, example: "TÜV" }
        category: { type: string, example: "TUV" }
        last: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        due_km: { type: integer, nullable: true }
        status: { type: string, enum: [ok, bald, ueberfaellig, unbekannt] }
        days: { type: integer, nullable: true }

    MailSettings:
      type: object
      properties:
        smtp_host: { type: string, nullable: true }
        smtp_port: { type: integer, nullable: true }
        smtp_security: { type: string, enum: [tls, starttls, none] }
        smtp_user: { type: string, nullable: true }
        has_password: { type: boolean }
        from_address: { type: string, nullable: true }
        to_address: { type: string, nullable: true }
        reminders_enabled: { type: boolean }
        reminder_days: { type: integer }
        monthly_report: { type: boolean }
        last_sent_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }

    MailSettingsRequest:
      type: object
      properties:
        smtpHost: { type: string, nullable: true }
        smtpPort: { type: integer, enum: [25, 465, 587, 2525] }
        smtpSecurity: { type: string, enum: [tls, starttls, none] }
        smtpUser: { type: string, nullable: true }
        smtpPassword: { type: string, description: "Nur senden, wenn es sich ändert" }
        clearPassword: { type: boolean }
        fromAddress: { type: string, nullable: true }
        toAddress: { type: string, nullable: true }
        remindersEnabled: { type: boolean }
        reminderDays: { type: integer, minimum: 1, maximum: 180 }
        monthlyReport: { type: boolean }

    EntryListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Entry"

    RevokeTokenRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 20
        reason:
          type: string
          nullable: true
      required: [token]

    RevokeTokenResponse:
      type: object
      additionalProperties: false
      properties:
        jti:
          type: string
        userId:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        message:
          type: string
      required: [jti, userId, message]

    RevokedToken:
      type: object
      additionalProperties: false
      properties:
        jti:
          type: string
        user_id:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        revoked_at:
          type: string
          format: date-time
      required: [jti, user_id, revoked_at]


    RevokeAllTokensRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          nullable: true

    RevokeAllTokensResponse:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        revokedAfter:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        message:
          type: string
      required: [userId, revokedAfter, message]
    
    DeleteFillupResponse:
      type: object
      additionalProperties: false
      properties:
        deletedId:
          type: string
          format: uuid
        olderThan14Days:
          type: boolean
        nextUpdated:
          type: boolean
        message:
          type: string
      required: [deletedId, olderThan14Days, nextUpdated, message]
