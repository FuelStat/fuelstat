          type: string
          format: date-time
        warnings:
          type: array
          description: Nur bei POST/PATCH – Hinweise auf einen unplausiblen Tachostand (gespeichert wird trotzdem)
          items:
            $ref: "#/components/schemas/OdometerWarning"
      required: [id, vehicle_id, category, amount_eur, occurred_at, created_at]

    EntryPatchRequest:
      type: object
      additionalProperties: false
      description: Alle Felder optional; nur gesendete Felder werden geändert
      properties:
        category:
          $ref: "#/components/schemas/EntryCategory"
        amountEur:
          type: number
          minimum: 0
        odometerKm:
          type: integer
          minimum: 0
          nullable: true
        occurredAt:
          type: string
          format: date-time
        vendor:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [currentPassword, newPassword]

    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32-Secret für die Authenticator-App
        otpauthUrl:
          type: string
          description: otpauth://-URL für den QR-Code

    MfaCodeRequest:
      type: object
      properties:
        code:
          type: string
          example: "123456"
        password:
          type: string
          description: Nur bei /auth/mfa/disable erforderlich
      required: [code]

    Reminder:
      type: object
      properties:
        title: { type: string, example: "TÜV" }
        category: { type: string, example: "TUV" }
        last: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        due_km: { type: integer, nullable: true }
        status: { type: string, enum: [ok, bald, ueberfaellig, unbekannt] }
        days: { type: integer, nullable: true }

    MailSettings:
      type: object
      properties:
        smtp_host: { type: string, nullable: true }
        smtp_port: { type: integer, nullable: true }
        smtp_security: { type: string, enum: [tls, starttls, none] }
        smtp_user: { type: string, nullable: true }
        has_password: { type: boolean }
        from_address: { type: string, nullable: true }
        to_address: { type: string, nullable: true }
        reminders_enabled: { type: boolean }
        reminder_days: { type: integer }
        monthly_report: { type: boolean }
        last_sent_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }

    MailSettingsRequest:
      type: object
      properties:
        smtpHost: { type: string, nullable: true }
        smtpPort: { type: integer, enum: [25, 465, 587, 2525] }
        smtpSecurity: { type: string, enum: [tls, starttls, none] }
        smtpUser: { type: string, nullable: true }
        smtpPassword: { type: string, description: "Nur senden, wenn es sich ändert" }
        clearPassword: { type: boolean }
        fromAddress: { type: string, nullable: true }
        toAddress: { type: string, nullable: true }
        remindersEnabled: { type: boolean }
        reminderDays: { type: integer, minimum: 1, maximum: 180 }
        monthlyReport: { type: boolean }

    EntryListResponse:
      description: Eine Seite (#160)
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        pagination:
          $ref: "#/components/schemas/Pagination"

    RevokeTokenRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 20
        reason:
          type: string
          nullable: true
      required: [token]

    RevokeTokenResponse:
      type: object
      additionalProperties: false
      properties:
        jti:
          type: string
        userId:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        message:
          type: string
      required: [jti, userId, message]

    RevokedToken:
      type: object
      additionalProperties: false
      properties:
        jti:
          type: string
        user_id:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        revoked_at:
          type: string
          format: date-time
      required: [jti, user_id, revoked_at]


    RevokeAllTokensRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          nullable: true

    RevokeAllTokensResponse:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        revokedAfter:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        message:
          type: string
      required: [userId, revokedAfter, message]
    
    DeleteFillupResponse:
      type: object
      additionalProperties: false
      properties:
        deletedId:
          type: string
          format: uuid
        olderThan14Days:
          type: boolean
        nextUpdated:
          type: boolean
        message:
          type: string
      required: [deletedId, olderThan14Days, nextUpdated, message]
