services:
  api:
    # Betrieb (#134): fertiges Image der veröffentlichten Version aus der GitHub Container Registry.
    # FUELSTAT_VERSION steht in .env und wird von infra/ausrollen.sh gesetzt; Ausrollen: sudo infra/ausrollen.sh X.Y.Z
    # Ohne FUELSTAT_VERSION (oder mit "docker compose up -d --build") wird wie bisher aus dem Code gebaut.
    image: ${FUELSTAT_API_IMAGE:-ghcr.io/fuelstat/fuelstat-api}:${FUELSTAT_VERSION:-lokal}
    build:
      context: ../backend
      dockerfile: Dockerfile
      # Code und Pakete stecken im Image (läuft als Benutzer "node"). Lokale Entwicklung: docker-compose.dev.yml
      target: prod
    # Der Port 3000 wird an 127.0.0.1 gebunden, damit er nur lokal (für Nginx)
    # und nicht direkt aus dem Internet erreichbar ist.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      # Hochgeladene Bilder bleiben außerhalb des Images; der Ordner muss dem Benutzer node (UID 1000) gehören
      - ../uploads:/usr/src/app/uploads
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', r=>process.exit(r.statusCode===200?0:1)).on('error', ()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Port nach außen schließen, da die API intern über den Service-Namen "db" zugreift
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Neue Installation: Schema beim allerersten Start (leeres Datenverzeichnis) automatisch anlegen.
      # Bei bestehender Datenbank ignoriert Postgres diesen Ordner; dort die Migrationen einspielen.
      - ../backend/database/postgres_init.sql:/docker-entrypoint-initdb.d/01-fuelstat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    restart: unless-stopped
    # Standard des Images ist [::]:8080 (nur IPv6); ohne IPv6 im Docker-Netz startet es dann nicht
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    # Adminer ebenfalls nur lokal binden oder über Nginx-Subdomain absichern
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
