openapi: 3.0.3
info:
  title: Fuelstat API
  version: "1.0.0"
  description: >
    Fuelstat Backend API (v1). Base URL ist produktiv auf tanken.1emc.de.
  contact:
    name: Mario Caraggiu
    url: https://tanken.1emc.de/pages/impressum.php
    email: mario@caraggiu.eu
  license:
    name: AGPL-3.0 license
    url: https://github.com/FuelStat/fuelstat?tab=AGPL-3.0-1-ov-file
servers:
  - url: https://tanken.1emc.de
    description: A self-hosted vehicle tracking and expense management app for fuel,
      maintenance, and running costs. Track fuel consumption, expenses, vehicle
      statistics, and more with a modern web interface and PWA support.

tags:
  - name: Health
  - name: Auth
  - name: Tokens
  - name: Users
  - name: Vehicles
  - name: Fillups
  - name: Stats
  - name: Entries
  - name: Feedback
  - name: Media
  - name: Stations

security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: healthy
                timestamp: "2025-12-23T13:47:17.641Z"
                service: fuelstat-api-v2

  /api/v1/db-ping:
    get:
      tags: [Health]
      summary: Health DB
      operationId: getDbPing
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbPingResponse"
              example:
                ok: true
                result:
                  ok: 1
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/whoami:
    get:
      tags: [Health]
      summary: Health whoami
      description: Gibt den eingeloggten User aus dem JWT zurück.
      operationId: getWhoAmI
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmIResponse"
              example:
                id: "97f6407a-b317-4715-ae74-f03885125c88"
                email: "mario@test.local"
                created_at: "2025-01-01T12:34:56.000Z"
                token:
                  jti: "c7b1c65a-9f4c-4f0e-9d62-..."
                  iat: "2025-12-23T08:34:47.135Z"
                  exp: "2025-12-30T08:34:47.135Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: User Register
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: "mario@test.local"
              password: "SuperSecret123!"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  id: "97f6407a-b317-4715-ae74-f03885125c88"
                  email: "mario@test.local"
                  createdAt: "2025-12-23T08:34:47.135Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Conflict (email_already_exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email_already_exists
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: User Login
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "mario@test.local"
              password: "SuperSecret123!"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized (invalid_credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid_credentials
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/tokens/revoke:
    post:
      tags: [Tokens]
      summary: Revoke Login Token
      operationId: postAuthTokensRevoke
      description: "Eigene Tokens kann jeder widerrufen, fremde nur Admins (ADMIN_USER_IDS)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
            example:
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              reason: "lost"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokenResponse"
              example:
                jti: "e253e319-17ae-4378-b68e-b07784cd4f39"
                userId: "46c597e1-0f50-4bd7-a02b-088c91842c76"
                reason: "lost"
                message: "Token wurde widerrufen und wird ab sofort abgelehnt."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/tokens:
    get:
      tags: [Tokens]
      summary: Get revoked Login Tokens (list)
      operationId: getAuthTokens
      description: "Admins sehen alle widerrufenen Tokens (optional gefiltert per userId), alle anderen nur ihre eigenen; userId wird dann ignoriert."
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter tokens by user ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevokedToken"
              example:
                - jti: "e253e319-17ae-4378-b68e-b07784cd4f39"
                  user_id: "46c597e1-0f50-4bd7-a02b-088c91842c76"
                  reason: "lost"
                  revoked_at: "2025-12-23T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/users/{userId}/revoke-all:
    post:
      tags: [Tokens, Users]
      summary: Revoke all Tokens of User
      operationId: postAuthUsersRevokeAll
      description: "Nur für den eigenen User oder Admins (ADMIN_USER_IDS)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllTokensRequest"
            example:
              reason: "reset"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllTokensResponse"
              example:
                userId: "46c597e1-0f50-4bd7-a02b-088c91842c76"
                revokedAfter: "2025-12-23T12:00:00.000Z"
                reason: "reset"
                message: "Alle bestehenden Tokens dieses Benutzers wurden widerrufen. Neue Logins erhalten wieder gültige Tokens."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/users:
    get:
      tags: [Users]
      summary: Get Users (list)
      operationId: getUsers
      description: "Nur für Admins (ADMIN_USER_IDS)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
              example:
                - id: "97f6407a-b317-4715-ae74-f03885125c88"
                  email: "mario@test.local"
                  created_at: "2025-01-01T12:34:56.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/users/{userId}:
    get:
      tags: [Users]
      summary: Get User (details)
      operationId: getUser
      description: "Nur für den eigenen User oder Admins (ADMIN_USER_IDS)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [Users]
      summary: Patch User (details)
      operationId: patchUser
      description: "Nur für den eigenen User oder Admins (ADMIN_USER_IDS)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
            example:
              email: "newmail@test.local"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict (email_already_exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email_already_exists
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Users]
      summary: Delete User
      operationId: deleteUser
      description: "Nur für den eigenen User oder Admins (ADMIN_USER_IDS)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles:
    post:
      tags: [Vehicles]
      summary: Create Vehicle
      operationId: postVehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreateRequest"
            example:
              name: "Kia Ceed"
              fuelType: "diesel"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "plan_required: Fahrzeuggrenze des Tarifs erreicht (nur mit PLAN_LIMITS_ENABLED=true), z. B. { error: plan_required, feature: maxVehicles, limit: 1, plan: free }"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Vehicles]
      summary: Get Vehicles (list)
      operationId: getVehicles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: Get Vehicle (details)
      operationId: getVehicle
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [Vehicles]
      summary: Patch Vehicle (details)
      operationId: patchVehicle
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehiclePatchRequest"
            example:
              name: "Cooles Auto"
              fuelType: "petrol"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Vehicles]
      summary: Delete Vehicle
      operationId: deleteVehicle
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/fillups:
    post:
      tags: [Fillups]
      summary: Create Fillup
      description: >
        Für Verbrenner typischerweise unit=l und amount=Liter.
        Für Elektro typischerweise unit=kWh und amount=geladene kWh.
      operationId: postFillups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillupCreateRequest"
            example:
              vehicleId: "24d22d87-8242-4fd2-8aa1-d2fa2c8ee43c"
              odometerKm: 699
              unit: "l"
              amount: 47.2
              totalCostEur: 86.3
              station: "Aral"
              filledAt: "2025-12-23T09:16:29.029Z"
              isFull: true
              skipPrevious: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fillup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Vehicle not found (for user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: vehicle_not_found
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}/fillups:
    get:
      tags: [Fillups]
      summary: Get Fillups (list by vehicle)
      operationId: getVehicleFillups
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/fillups/{fillupId}:
    get:
      tags: [Fillups]
      summary: Get Fillup (details)
      operationId: getFillup
      parameters:
        - $ref: "#/components/parameters/FillupId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fillup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [Fillups]
      summary: Patch Fillup (details)
      description: >
        Bearbeitung ist nur innerhalb von 14 Tagen nach dem Tank-/Ladedatum (filledAt) möglich.
        Ältere Einträge können nicht mehr bearbeitet werden.
      operationId: patchFillup
      parameters:
        - $ref: "#/components/parameters/FillupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillupPatchRequest"
            example:
              odometerKm: 125600
              unit: "l"
              amount: 55.2
              totalCostEur: 92.45
              station: "Shell Tankstelle Musterstraße"
              filledAt: "2023-10-27T14:30:00Z"
              isFull: true
              skipPrevious: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fillup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict (fillup_edit_window_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: fillup_edit_window_expired
                message: "Tank-/Ladevorgänge können nur innerhalb von 14 Tagen nach dem Tank-/Ladedatum bearbeitet werden."
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Fillups]
      summary: Delete Fillup
      description: >
        Löschung ist immer möglich. Wenn der Eintrag älter als 14 Tage ist,
        wird der nachfolgende Fillup automatisch auf skip_previous=true gesetzt.
      operationId: deleteFillup
      parameters:
        - $ref: "#/components/parameters/FillupId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFillupResponse"
              example:
                deletedId: "e253e319-17ae-4378-b68e-b07784cd4f39"
                olderThan14Days: true
                nextUpdated: true
                message: "Ein Tank-/Ladevorgang, der älter als 14 Tage ist, wurde gelöscht. Der nachfolgende Vorgang wird bei der Verbrauchsberechnung nicht mehr den vorherigen berücksichtigen (skip_previous = true)."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}/consumption:
    get:
      tags: [Stats]
      summary: Consumption, amounts and CO₂ per unit (segments, months, years)
      description: "Grundlage sind die Full-to-Full-Abschnitte von /stats; Regeln siehe docs/api.md (#82)."
      operationId: getVehicleConsumption
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fuelType: { type: string, nullable: true }
                  units: { type: array, items: { type: string, enum: [l, kwh, kg] } }
                  byUnit:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        unit: { type: string, enum: [l, kwh, kg] }
                        avg: { type: number, nullable: true }
                        min: { type: number, nullable: true }
                        max: { type: number, nullable: true }
                        kmConsumed: { type: number }
                        amountConsumed: { type: number }
                        amountBought: { type: number }
                        cost: { type: number }
                        avgPrice: { type: number, nullable: true }
                        fillCount: { type: integer }
                        co2:
                          type: object
                          properties:
                            factor: { type: number, nullable: true }
                            totalKg: { type: number, nullable: true }
                            gPerKm: { type: number, nullable: true }
                        segments:
                          type: array
                          items:
                            type: object
                            properties:
                              fullId: { type: string, format: uuid }
                              date: { type: string, format: date }
                              month: { type: string, example: "2026-01" }
                              km: { type: number }
                              amount: { type: number }
                              consumption: { type: number, nullable: true }
                        months:
                          type: array
                          items:
                            type: object
                            properties:
                              month: { type: string }
                              km: { type: number }
                              amount: { type: number }
                              consumption: { type: number, nullable: true }
                        years:
                          type: array
                          items:
                            type: object
                            properties:
                              year: { type: integer }
                              fillCount: { type: integer }
                              amountBought: { type: number }
                              cost: { type: number }
                              amountConsumed: { type: number }
                              kmConsumed: { type: number }
                              consumption: { type: number, nullable: true }
                              co2Kg: { type: number, nullable: true }
                  energyCost: { type: number }
                  electricShare: { type: number, nullable: true, description: "Anteil Ladekosten an Energiekosten in %" }
                  co2:
                    type: object
                    properties:
                      totalKg: { type: number, nullable: true }
                      gPerKm: { type: number, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/costs:
    get:
      tags: [Stats]
      summary: Vehicle costs (totals, cost per km, current month, monthly sums)
      description: "Monate und Jahre in Europe/Berlin. Regeln siehe docs/api.md (#124)."
      operationId: getVehicleCosts
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer, nullable: true }
                  currency: { type: string, example: EUR }
                  total:
                    $ref: "#/components/schemas/CostSums"
                  distanceKm: { type: integer, nullable: true }
                  costPerKm:
                    type: object
                    properties:
                      energy: { type: number, nullable: true, description: "€/km, Tank-/Ladekosten" }
                      total: { type: number, nullable: true, description: "€/km, alle Kosten" }
                  perMonth: { type: number, nullable: true }
                  monthCount: { type: integer }
                  currentMonth:
                    allOf:
                      - $ref: "#/components/schemas/CostSums"
                      - { type: object, properties: { month: { type: string, example: "2026-03" } } }
                  previousMonth:
                    allOf:
                      - $ref: "#/components/schemas/CostSums"
                      - { type: object, properties: { month: { type: string, example: "2026-02" } } }
                  months:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CostSums"
                        - type: object
                          properties:
                            month: { type: string, example: "2026-02" }
                            count: { type: integer }
                            counts:
                              type: object
                              properties:
                                fuel: { type: integer }
                                charge: { type: integer }
                                expense: { type: integer }
                                trip: { type: integer }
                                odometer: { type: integer }
                            byType:
                              type: object
                              properties:
                                fuel: { type: number }
                                charge: { type: number }
                                expense: { type: number }
                            byCategory:
                              type: object
                              description: "Kosten je Kategorie; Tank-/Ladevorgänge als Tankfuellung:<Einheit>"
                              additionalProperties: { type: number }
                  categories:
                    type: array
                    description: Summe und Anzahl je Kategorie im Zeitraum, größte zuerst
                    items:
                      type: object
                      properties:
                        key: { type: string, example: "Tankfuellung:l" }
                        total: { type: number }
                        count: { type: integer }
                  years:
                    type: array
                    description: Jahre mit Kosten (gesamter Zeitraum), neueste zuerst
                    items: { type: integer }
        "400":
          description: invalid_year
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/stats:
    get:
