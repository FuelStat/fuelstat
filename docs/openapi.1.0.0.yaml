  /api/v1/fuels:
    get:
      tags: [Vehicles]
      summary: Fuel grades and energy types (#140)
      description: >
        Liste der Kraftstoffsorten mit Energieart und Einheit, dazu die Energiearten (mit CO₂-Faktor) und der
        Vorschlag je Antriebsart (fuelTypeDefaults, erste Sorte = Standard). Ohne Anmeldung; ändert sich nur mit
        neuen Versionen (Cache-Control 1 Stunde). Clients pflegen keine eigene Liste.
      operationId: getFuels
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  energies:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { $ref: "#/components/schemas/Energy" }
                        name: { type: string, example: Benzin }
                        unit: { $ref: "#/components/schemas/FillupUnit" }
                        co2Factor: { type: number, nullable: true, description: "kg CO₂ je Einheit" }
                  fuels:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: premium_diesel }
                        name: { type: string, example: Premium-Diesel }
                        energy: { $ref: "#/components/schemas/Energy" }
                        unit: { $ref: "#/components/schemas/FillupUnit" }
                        premium: { type: boolean, description: "Mehrpreis wird gegenüber den übrigen Sorten der Energieart gezeigt" }
                        tankerkoenig: { type: string, nullable: true, enum: [e5, e10, diesel, null], description: "Sorte für Preise in /stations" }
                        hint: { type: string, nullable: true, example: "z. B. Ultimate Diesel, V-Power Diesel" }
                  fuelTypeDefaults:
                    type: object
                    description: "Sorten je Antriebsart, z. B. phev: [super_e5, electricity]"
                    additionalProperties: { type: array, items: { type: string } }

