                currentOdo: 12845
                avgPricePerLiter: 1.828
                avgConsumption: 19.5
                segments:
                  - full_id: "5546f0ac-b9f7-4d31-92c1-7886aba01701"
                    full_at: "2025-12-23T09:11:23.890Z"
                    km: 300
                    liters_segment: 47.2
                    l_per_100km: 15.73
                trend:
                  current: 15.73
                  avgPrev: 23.6
                  diff: -7.87
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
