              odometerKm: 699
              unit: "l"
              amount: 47.2
              totalCostEur: 86.3
              station: "Aral"
              filledAt: "2025-12-23T09:16:29.029Z"
              isFull: true
              skipPrevious: false
      responses:
        "201":
          description: Created
          content:
