  /api/v1/fillups/{fillupId}:
    get:
      tags: [Fillups]
      summary: Get Fillup (details)
      operationId: getFillup
      parameters:
        - $ref: "#/components/parameters/FillupId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fillup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [Fillups]
      summary: Patch Fillup (details)
      description: >
        Bearbeitung ist nur innerhalb von 14 Tagen nach dem Tank-/Ladedatum (filledAt) möglich.
        Ältere Einträge können nicht mehr bearbeitet werden.
      operationId: patchFillup
      parameters:
        - $ref: "#/components/parameters/FillupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillupPatchRequest"
            example:
              odometerKm: 125600
              unit: "l"
              amount: 55.2
              totalCostEur: 92.45
              station: "Shell Tankstelle Musterstraße"
              filledAt: "2023-10-27T14:30:00Z"
              isFull: true
              skipPrevious: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fillup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict (fillup_edit_window_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: fillup_edit_window_expired
                message: "Tank-/Ladevorgänge können nur innerhalb von 14 Tagen nach dem Tank-/Ladedatum bearbeitet werden."
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Fillups]
      summary: Delete Fillup
      description: >
        Löschung ist immer möglich. Wenn der Eintrag älter als 14 Tage ist,
        wird der nachfolgende Fillup automatisch auf skip_previous=true gesetzt.
      operationId: deleteFillup
      parameters:
        - $ref: "#/components/parameters/FillupId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFillupResponse"
              example:
                deletedId: "e253e319-17ae-4378-b68e-b07784cd4f39"
                olderThan14Days: true
                nextUpdated: true
                message: "Ein Tank-/Ladevorgang, der älter als 14 Tage ist, wurde gelöscht. Der nachfolgende Vorgang wird bei der Verbrauchsberechnung nicht mehr den vorherigen berücksichtigen (skip_previous = true)."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/entries:
    post:
      tags: [Entries]
      summary: Create Entry (expense/maintenance/etc.)
      description: >
        Generischer Eintrag für Kosten und Ereignisse. category ist ein Schlüssel aus GET /api/v1/categories;
        unbekannte Kategorien ergeben 400 unknown_category, gesperrte 403 plan_required.
      operationId: postEntries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryCreateRequest"
            example:
              vehicleId: "e3585b92-e620-470e-ae96-f11bc3baf1d1"
              category: "Reparatur"
              amountEur: 65.5
              odometerKm: 45200
              occurredAt: "2023-10-27T14:30:00Z"
              vendor: "Shell"
              description: "Repair"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}/entries:
    get:
      tags: [Entries]
      summary: Get Entries (list by vehicle)
      operationId: getVehicleEntries
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/entries/{entryId}:
    get:
      tags: [Entries]
      summary: Get Entry (details)
      operationId: getEntry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [Entries]
      summary: Patch Entry (details)
      operationId: patchEntry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryPatchRequest"
            example:
              amountEur: 275.5
              vendor: "ATU"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Entries]
      summary: Delete Entry
      operationId: deleteEntry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}/import:
    post:
      tags: [Entries]
      summary: Import fillups and entries (e.g. from CSV)
      description: "Max. 1000 Zeilen, alles in einer Transaktion. Duplikate (gleiches Datum + Tachostand + Einheit bzw. Datum + Kategorie + Betrag) werden übersprungen. `fuel` je Zeile gilt, wenn die Sorte zum Fahrzeug gehört (#140); sonst `unit` je Zeile nur bei Plug-in-Hybriden (l oder kwh), immer mit dem Standard des Fahrzeugs für diese Einheit."
      operationId: postVehicleImport
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fillups:
                  type: array
                  items:
                    $ref: "#/components/schemas/FillupCreateRequest"
                entries:
                  type: array
                  items:
                    $ref: "#/components/schemas/EntryCreateRequest"
                dryRun:
                  type: boolean
                  description: Nur prüfen, nichts speichern (Antwort 200 mit Duplikaten und Warnungen)
      responses:
        "200":
          description: "Probelauf (dryRun): gleiche Felder wie 201 plus dryRun: true"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: object
                    properties:
                      fillups: { type: integer }
                      entries: { type: integer }
                  skipped:
                    type: object
                    properties:
                      fillups: { type: integer }
                      entries: { type: integer }
                  duplicates:
                    type: array
                    description: Übersprungene Zeilen (type fillup|entry, index in der jeweiligen Liste)
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        index: { type: integer }
                  warnings:
                    type: array
                    description: Unplausible Tachostände je Zeile (type, index und die Felder von OdometerWarning)
                    items:
                      type: object
        "400":
          description: nothing_to_import | too_many_rows | invalid_rows
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/trips:
    post:
      tags: [Trips]
      summary: Create a trip (logbook, #52)
      description: >
        Tachostand Ende ist Pflicht. Strecke = Ende − Start, ohne Start aus distanceKm (bei ganzen km wird der Start
        daraus berechnet). Zwecke: private und business im Free-Tarif, commute ab Plus (plan_required, feature
        tripCategories). Erfassen dürfen Besitzer und Mitfahrer.
      operationId: postTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TripInput"
                - type: object
                  properties:
                    vehicleId: { type: string, format: uuid }
                  required: [vehicleId, odometerEnd]
            example:
              vehicleId: "24d22d87-8242-4fd2-8aa1-d2fa2c8ee43c"
              startedAt: "2026-03-02T07:30:00Z"
              odometerStart: 10000
              odometerEnd: 10042
              startPlace: "Bolbingen"
              endPlace: "Aalen"
              purpose: "business"
      responses:
        "201":
          description: Created (mit warnings bei unplausiblem Tachostand)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: "missing_vehicleId | invalid_odometerEnd | invalid_odometerStart | invalid_distanceKm | invalid_startedAt | invalid_endedAt | invalid_purpose"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: read_only | plan_required (tripCategories) | email_not_verified (maxEntries)
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trips/{tripId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Trips]
      summary: Get a trip
      operationId: getTrip
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: trip_not_found
    patch:
      tags: [Trips]
      summary: Change a trip (owner all, editor own trips)
      operationId: patchTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: siehe POST /trips
        "403":
          description: entry_not_editable | plan_required
        "404":
          description: trip_not_found
    delete:
      tags: [Trips]
      summary: Delete a trip (owner all, editor own trips)
      operationId: deleteTrip
      responses:
        "204":
          description: No Content
        "403":
          description: entry_not_editable
        "404":
          description: trip_not_found

  /api/v1/vehicles/{vehicleId}/timeline:
    get:
      tags: [Entries]
      summary: Entry list of a vehicle – fill-ups, expenses and trips mixed, paginated (#160)
      description: >
        Neueste zuerst (Zeitpunkt, dann Erfassung, dann id). Filter nach Art, Jahr (Europe/Berlin) und Suchtext (Ort,
        Beschreibung, Kategorie, Start und Ziel; % und _ gelten wörtlich). months enthält die Summen der Monate auf
        dieser Seite – über den ganzen Monat, mit denselben Filtern. years und kinds gelten ohne Filter (für
        Jahresauswahl und Filter-Chips).
      operationId: getVehicleTimeline
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - { name: type, in: query, required: false, description: "Kommagetrennt: fuel, charge, expense, trip, odometer", schema: { type: string, example: "fuel,charge" } }
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimelineItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  months:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string, example: "2026-01" }
                        count: { type: integer }
                        total: { type: number, description: "Kosten (ohne Fahrten und km-Notizen)" }
                  years: { type: array, items: { type: integer } }
                  kinds:
                    type: object
                    description: "Anzahl je Art, z. B. { fuel: 120, charge: 880 }"
                    additionalProperties: { type: integer }
        "400":
          description: invalid_page | invalid_per_page | invalid_type | invalid_year
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/trips:
    get:
      tags: [Trips]
      summary: Trips of a vehicle, newest first
      operationId: getVehicleTrips
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 }, description: "Jahr in Europe/Berlin" }
        - { name: purpose, in: query, required: false, schema: { type: string, enum: [private, business, commute] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trip"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  months:
                    type: array
                    description: "Monate auf dieser Seite – Anzahl und km über den ganzen Monat, mit denselben Filtern (#160)"
                    items:
                      type: object
                      properties:
                        month: { type: string, example: "2026-03" }
                        count: { type: integer }
                        km: { type: number }
                  years:
                    type: array
                    description: Alle Jahre mit Fahrten (ohne Filter), für die Jahresauswahl
                    items: { type: integer }
        "400":
          description: invalid_year | invalid_purpose
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/trips/summary:
    get:
      tags: [Trips]
      summary: Logbook evaluation (km per purpose and month, business share, estimated cost)
      description: "Geschätzte Kosten = Kosten pro km des Fahrzeugs (aus /costs, gleiches Jahr) × Strecke."
      operationId: getVehicleTripSummary
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "400":
          description: invalid_year
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/trips/export:
    get:
      tags: [Trips]
      summary: Logbook as CSV (plan feature tripExport)
      description: "Semikolon-getrennt, deutsches Zahlenformat, mit BOM für Excel; Zellen, die mit = + - @ beginnen, werden entschärft."
      operationId: getVehicleTripsExport
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 } }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        "403":
          description: plan_required (tripExport)
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/categories:
    get:
      tags: [Entries]
      summary: Categories for expenses (built-in, premium, custom, legacy)
      description: >
        Liefert groups, categories (key, name, icon, color, group, form, countsAsCost, plan, custom, selectable, available)
        und custom (max, used, canCreate, icons, colors, nameMaxLength). Cache-Control private, max-age=300; ETag.
      operationId: getCategories
      responses:
        "200":
          description: OK
        "304":
          description: Not Modified (If-None-Match)
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Entries]
      summary: Create a custom category (plan feature customCategories)
      operationId: postCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
                icon: { type: string, example: "fa-ferry" }
                color: { type: string, example: "#0dcaf0" }
                group: { type: string, enum: [fix, wartung, unterwegs, sonstiges] }
      responses:
        "201":
          description: Created (key custom:<id>)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: plan_required oder category_limit_reached
        "409":
          description: name_taken

  /api/v1/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Entries]
      summary: Change a custom category (name, icon, color, group)
      operationId: patchCategory
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: name_taken
    delete:
      tags: [Entries]
      summary: Delete a custom category; entries move to moveTo
      operationId: deleteCategory
      parameters:
        - name: moveTo
          in: query
          required: false
          schema: { type: string, example: "Sonstiges" }
      responses:
        "200":
          description: "OK ({ deleted, moved, moveTo })"
        "400":
          description: invalid_moveTo
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: category_in_use (moveTo fehlt)

  /api/v1/vehicles/{vehicleId}/stats:
    get:
      tags: [Stats]
      summary: Get Vehicle Stats
      operationId: getVehicleStats
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStatsResponse"
              example:
                currentOdo: 12845
                avgPricePerLiter: 1.828
                avgConsumption: 19.5
                segments:
                  - full_id: "5546f0ac-b9f7-4d31-92c1-7886aba01701"
                    full_at: "2025-12-23T09:11:23.890Z"
                    km: 300
                    liters_segment: 47.2
                    l_per_100km: 15.73
                trend:
                  current: 15.73
                  avgPrev: 23.6
                  diff: -7.87
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}/consumption:
    get:
      tags: [Stats]
      summary: Consumption, amounts and CO₂ per energy type, prices per fuel grade (segments, months, years)
      description: "Grundlage sind die Full-to-Full-Abschnitte von /stats; Regeln siehe docs/api.md (#82)."
      operationId: getVehicleConsumption
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fuelType: { type: string, nullable: true }
                  fuels: { type: array, items: { type: string }, description: "Sorten des Fahrzeugs (#140)" }
                  defaultFuel: { type: string }
                  units: { type: array, items: { type: string, enum: [l, kwh, kg] } }
                  energies: { type: array, items: { $ref: "#/components/schemas/Energy" }, description: "Energiearten mit Einträgen, die des Standards zuerst (#140)" }
                  byEnergy:
                    type: object
                    description: "Je Energieart dieselben Felder wie byUnit, dazu name, costShare (% der Energiekosten) und minor (nebenbei getankt, < 10 %: Verbrauch nicht als Wert zeigen)"
                    additionalProperties: { type: object }
                  byFuel:
                    type: object
                    description: "Je Sorte (#140): Menge, Kosten, Ø Preis, Anteil an der Menge der Energieart, Mehrpreis von Premium-Sorten gegenüber den übrigen Sorten der Energieart"
                    additionalProperties:
                      type: object
                      properties:
                        fuel: { type: string }
                        name: { type: string }
                        energy: { $ref: "#/components/schemas/Energy" }
                        unit: { type: string, enum: [l, kwh, kg] }
                        premium: { type: boolean }
                        fillCount: { type: integer }
                        amount: { type: number }
                        cost: { type: number }
                        avgPrice: { type: number, nullable: true }
                        shareOfEnergy: { type: number, nullable: true }
                        markup:
                          type: object
                          nullable: true
                          properties:
                            perUnit: { type: number }
                            percent: { type: number, nullable: true }
                            basePrice: { type: number }
                  costPer100km: { type: number, nullable: true, description: "Energiekosten pro 100 km über alle Energiearten" }
                  byUnit:
                    type: object
                    description: "Bisheriges Format: je Einheit die Hauptenergieart der Einheit (die des Standards), siehe energy"
                    additionalProperties:
                      type: object
                      properties:
                        unit: { type: string, enum: [l, kwh, kg] }
                        energy: { $ref: "#/components/schemas/Energy" }
                        avg: { type: number, nullable: true }
                        min: { type: number, nullable: true }
                        max: { type: number, nullable: true }
                        kmConsumed: { type: number }
                        amountConsumed: { type: number }
                        amountBought: { type: number }
                        cost: { type: number }
                        avgPrice: { type: number, nullable: true }
                        fillCount: { type: integer }
                        co2:
                          type: object
                          properties:
                            factor: { type: number, nullable: true }
                            totalKg: { type: number, nullable: true }
                            gPerKm: { type: number, nullable: true }
                        segments:
                          type: array
                          items:
                            type: object
                            properties:
                              fullId: { type: string, format: uuid }
                              date: { type: string, format: date }
                              month: { type: string, example: "2026-01" }
                              km: { type: number }
                              amount: { type: number }
                              consumption: { type: number, nullable: true }
                        months:
                          type: array
                          items:
                            type: object
                            properties:
                              month: { type: string }
                              km: { type: number }
                              amount: { type: number }
                              consumption: { type: number, nullable: true }
                        years:
                          type: array
                          items:
                            type: object
                            properties:
                              year: { type: integer }
                              fillCount: { type: integer }
                              amountBought: { type: number }
                              cost: { type: number }
                              amountConsumed: { type: number }
                              kmConsumed: { type: number }
                              consumption: { type: number, nullable: true }
                              co2Kg: { type: number, nullable: true }
                  energyCost: { type: number }
                  electricShare: { type: number, nullable: true, description: "Anteil Ladekosten an Energiekosten in %" }
                  co2:
                    type: object
                    properties:
                      totalKg: { type: number, nullable: true }
                      gPerKm: { type: number, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/costs:
    get:
      tags: [Stats]
      summary: Vehicle costs (totals, cost per km, current month, monthly sums)
      description: "Monate und Jahre in Europe/Berlin. Regeln siehe docs/api.md (#124)."
      operationId: getVehicleCosts
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  year: { type: integer, nullable: true }
                  currency: { type: string, example: EUR }
                  total:
                    $ref: "#/components/schemas/CostSums"
                  distanceKm: { type: integer, nullable: true }
                  costPerKm:
                    type: object
                    properties:
                      energy: { type: number, nullable: true, description: "€/km, Tank-/Ladekosten" }
                      total: { type: number, nullable: true, description: "€/km, alle Kosten" }
                  perMonth: { type: number, nullable: true }
                  monthCount: { type: integer }
                  currentMonth:
                    allOf:
                      - $ref: "#/components/schemas/CostSums"
                      - { type: object, properties: { month: { type: string, example: "2026-03" } } }
                  previousMonth:
                    allOf:
                      - $ref: "#/components/schemas/CostSums"
                      - { type: object, properties: { month: { type: string, example: "2026-02" } } }
                  months:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CostSums"
                        - type: object
                          properties:
                            month: { type: string, example: "2026-02" }
                            count: { type: integer }
                            counts:
                              type: object
                              properties:
                                fuel: { type: integer }
                                charge: { type: integer }
                                expense: { type: integer }
                                trip: { type: integer }
                                odometer: { type: integer }
                            byType:
                              type: object
                              properties:
                                fuel: { type: number }
                                charge: { type: number }
                                expense: { type: number }
                            byCategory:
                              type: object
                              description: "Kosten je Kategorie; Tank-/Ladevorgänge als Tankfuellung:<Einheit>"
                              additionalProperties: { type: number }
                  categories:
                    type: array
                    description: Summe und Anzahl je Kategorie im Zeitraum, größte zuerst
                    items:
                      type: object
                      properties:
                        key: { type: string, example: "Tankfuellung:l" }
                        total: { type: number }
                        count: { type: integer }
                  energies:
                    type: array
                    description: Energiekosten je Energieart im Zeitraum (#140)
                    items:
                      type: object
                      properties:
                        energy: { $ref: "#/components/schemas/Energy" }
                        name: { type: string }
                        total: { type: number }
                        count: { type: integer }
                        share: { type: number, nullable: true, description: "% der Energiekosten" }
                  years:
                    type: array
                    description: Jahre mit Kosten (gesamter Zeitraum), neueste zuerst
                    items: { type: integer }
        "400":
          description: invalid_year
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stations:
    get:
      tags: [Stations]
      summary: Nearby fuel stations with current prices (Tankerkönig, CC BY 4.0)
      description: "Nach Entfernung sortiert, 2 Minuten gecacht, 30 Abfragen pro Minute und Konto. Die Quelle Tankerkönig muss angezeigt werden."
      operationId: getStations
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius, in: query, required: false, schema: { type: number, minimum: 1, maximum: 25, default: 5 } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [e5, e10, diesel, all], default: all } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        brand: { type: string, nullable: true }
                        street: { type: string, nullable: true }
                        houseNumber: { type: string, nullable: true }
                        postCode: { type: string, nullable: true }
                        place: { type: string, nullable: true }
                        lat: { type: number }
                        lng: { type: number }
                        distanceKm: { type: number, nullable: true }
                        isOpen: { type: boolean }
                        prices:
                          type: object
                          description: "Preis je Sorte in EUR/l, null wenn nicht angeboten; bei type=all e5, e10 und diesel"
                          additionalProperties: { type: number, nullable: true }
                      required: [id, name, lat, lng, isOpen, prices]
                  source: { type: string, example: Tankerkönig }
                  license: { type: string, example: CC BY 4.0 }
                  sourceUrl: { type: string }
                required: [stations]
        "400":
          description: invalid_coordinates | invalid_radius
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: too_many_requests
        "502":
          description: stations_unavailable (Tankerkönig nicht erreichbar)
        "503":
          description: stations_not_configured (TANKERKOENIG_API_KEY fehlt)

  /api/v1/charging-stations:
    get:
      tags: [Stations]
      summary: Nearby charging stations (Open Charge Map, CC BY 4.0)
      description: "Nach Entfernung sortiert, höchstens 30 Treffer, 6 Stunden gecacht, 30 Abfragen pro Minute und Konto. Die Quelle Open Charge Map muss angezeigt werden."
      operationId: getChargingStations
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius, in: query, required: false, schema: { type: number, minimum: 1, maximum: 25, default: 5 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, nullable: true }
                        name: { type: string }
                        operator: { type: string, nullable: true }
                        street: { type: string, nullable: true }
                        place: { type: string, nullable: true }
                        postCode: { type: string, nullable: true }
                        lat: { type: number, nullable: true }
                        lng: { type: number, nullable: true }
                        distanceKm: { type: number, nullable: true }
                        points: { type: integer, nullable: true, description: Anzahl Ladepunkte }
                        maxKw: { type: number, nullable: true, description: Höchste Ladeleistung in kW }
                        connectors: { type: array, items: { type: string }, description: "Steckertypen, z. B. CCS, Typ 2" }
                        usageCost: { type: string, nullable: true, description: Kostenhinweis des Betreibers (Freitext) }
                        isOperational: { type: boolean }
                      required: [name, connectors, isOperational]
                  source: { type: string, example: Open Charge Map }
                  license: { type: string, example: CC BY 4.0 }
                  sourceUrl: { type: string }
                required: [stations]
        "400":
          description: invalid_coordinates | invalid_radius
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: too_many_requests
        "502":
          description: charging_stations_unavailable (Open Charge Map nicht erreichbar)
        "503":
          description: charging_stations_not_configured (OCM_API_KEY fehlt)

  /api/v1/media/upload:
    post:
      tags: [Media]
      summary: Upload profile image
      description: "multipart/form-data mit Feld `file`, max. 20 MB, nur JPEG/PNG/GIF/WebP (Inhalt wird geprüft). Danach `PATCH /api/v1/auth/users/{userId}` mit `profileImageUrl`."
      operationId: uploadUserMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: missing_file | invalid_image
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/media:
    get:
      tags: [Media]
      summary: List own uploaded images
      operationId: listUserMedia
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Media]
      summary: Get own image
      operationId: getUserMedia
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Media]
      summary: Delete own image
      operationId: deleteUserMedia
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/media/upload:
    post:
      tags: [Media]
      summary: Upload vehicle image
      description: "multipart/form-data mit Feld `file`, wie beim Profilbild. Danach `PATCH /api/v1/vehicles/{vehicleId}` mit `imageUrl`."
      operationId: uploadVehicleMedia
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: missing_file | invalid_image
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/media:
    get:
      tags: [Media]
      summary: List vehicle images
      operationId: listVehicleMedia
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/media/{mediaId}:
    delete:
      tags: [Media]
      summary: Delete vehicle image
      operationId: deleteVehicleMedia
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/files/{name}:
    get:
      tags: [Media]
      summary: Signed image download (no login; URL comes from API responses)
      description: >
        Bilder sind nur über signierte Adressen abrufbar, die die API in url, image_url und profile_image_url liefert.
        Gültig bis Ende des nächsten Tages (UTC), Cache-Control private.
      operationId: getFile
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, example: "3f2c0d1e-0000-4000-8000-000000000000.webp" } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Bild (image/webp)
        "404":
          description: Unbekannt, falsche Signatur oder abgelaufen

  /api/v1/feedback:
    post:
      tags: [Feedback]
      summary: Send feedback (stored and mailed to the operator)
      operationId: postFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  enum: [fehler, idee, lob, sonstiges]
                message:
                  type: string
                  minLength: 3
                  maxLength: 5000
                page:
                  type: string
                  maxLength: 300
                  description: Seite, von der das Feedback kommt
              required: [category, message]
      responses:
        "201":
          description: "Gespeichert ({ id, saved: true, mailed })"
        "400":
          description: invalid_category | invalid_message | invalid_page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: too_many_attempts (höchstens 10 je 15 Minuten)
    get:
      tags: [Feedback]
      summary: List feedback (admin only, open first)
      operationId: getFeedback
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: "Eine Seite (#160): data mit id, category, message, page, user_agent, done, created_at, user_email, username, beta_tester; pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden

  /api/v1/feedback/{id}:
    patch:
      tags: [Feedback]
      summary: Mark feedback as done or open (admin only)
      operationId: patchFeedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                done:
                  type: boolean
              required: [done]
      responses:
        "200":
          description: "OK ({ id, done })"
        "400":
          description: invalid_done
        "403":
          description: forbidden
        "404":
          description: feedback_not_found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FillupId:
      name: fillupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Seite, ab 1 (#160). Hinter der letzten Seite kommt eine leere Liste mit der Gesamtzahl.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: "Einträge je Seite (#160); limit ist ein Alias. Mehr als 100 werden auf 100 begrenzt."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_request
            detail: "Validation failed"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: forbidden
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_token
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not_found
    TooManyAttempts:
      description: Too Many Attempts (Sperre für 15 Minuten)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [too_many_attempts]
              retry_after_minutes:
                type: integer
          example:
            error: too_many_attempts
            retry_after_minutes: 15
    ServerError:
      description: Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: server_error
            detail: "Unexpected error"

  schemas:
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid, description: nur bei Fahrzeugbildern }
        media_type: { type: string, example: image }
        url: { type: string, example: /uploads/3f9c….jpg }
        mime_type: { type: string, example: image/jpeg }
        bytes: { type: integer }
        created_at: { type: string, format: date-time }

    VehicleMembers:
      type: object
      properties:
        role: { type: string, enum: [owner, editor, viewer], description: Rolle des angemeldeten Kontos }
        owner:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            name: { type: string, description: Benutzername oder E-Mail-Adresse }
            email: { type: string, format: email }
            role: { type: string, enum: [owner] }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string, format: email }
              role: { type: string, enum: [editor, viewer] }
              created_at: { type: string, format: date-time }
        invitations:
          type: array
          description: Nur für den Besitzer
          items:
            $ref: "#/components/schemas/VehicleInvitation"

    VehicleInvitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [editor, viewer] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    IncomingInvitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        vehicle_name: { type: string }
        role: { type: string, enum: [editor, viewer] }
        invited_by_name: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    TripInput:
      type: object
      additionalProperties: false
      properties:
        startedAt: { type: string, format: date-time, description: "Standard: jetzt" }
        endedAt: { type: string, format: date-time, nullable: true }
        odometerStart: { type: integer, nullable: true, minimum: 0 }
        odometerEnd: { type: integer, minimum: 0, description: Tachostand am Ende der Fahrt }
        distanceKm: { type: number, minimum: 0, description: "Nur ohne odometerStart" }
        startPlace: { type: string, nullable: true, maxLength: 200 }
        endPlace: { type: string, nullable: true, maxLength: 200 }
        purpose: { type: string, enum: [private, business, commute], default: private }
        note: { type: string, nullable: true, maxLength: 200 }

    Trip:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid, description: Fahrer bzw. wer die Fahrt erfasst hat }
        created_by_name: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        odometer_start: { type: integer, nullable: true }
        odometer_end: { type: integer }
        distance_km: { type: number }
        start_place: { type: string, nullable: true }
        end_place: { type: string, nullable: true }
        purpose: { type: string, enum: [private, business, commute] }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        warnings:
          type: array
          description: Nur bei POST/PATCH
          items:
            $ref: "#/components/schemas/OdometerWarning"

    TripSummary:
      type: object
      properties:
        year: { type: integer, nullable: true }
        count: { type: integer }
        totalKm: { type: number }
        byPurpose:
          type: object
          additionalProperties:
            type: object
            properties:
              km: { type: number }
              count: { type: integer }
              estimatedCost: { type: number, nullable: true }
        businessShare: { type: number, nullable: true, description: Anteil dienstlich in Prozent }
        costPerKm: { type: number, nullable: true }
        months:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: "2026-03" }
              private: { type: number }
              business: { type: number }
              commute: { type: number }
        purposes: { type: array, items: { type: string } }
        allowedPurposes: { type: array, items: { type: string }, description: Zwecke im Tarif des Kontos }
        canExport: { type: boolean }

    LoginErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [invalid_credentials, mfa_required, invalid_mfa_code]
        mfaToken:
          type: string
          description: Nur bei mfa_required; 5 Minuten gültig, für POST /api/v1/auth/login/mfa
      required: [error]

    ErrorResponse:
      type: object
      description: "Fehler: `error` ist ein fester Schlüssel für Clients. Je nach Fehler kommen weitere Felder dazu (z. B. message, oder feature/limit/plan bei plan_required)."
      additionalProperties: true
      properties:
        error:
          type: string
        detail:
          type: string
          nullable: true
        message:
          type: string
          description: Lesbarer Hinweis (Deutsch), wo vorhanden
      required: [error]

    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [healthy]
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        version:
          type: string
          example: "0.10.0"
          description: Version des Servers (Semantic Versioning); Apps erkennen daran veraltete Server
        registration_enabled:
          type: boolean
          description: false, wenn die Registrierung abgeschaltet ist (REGISTRATION_ENABLED=false)
        beta_phase:
          type: boolean
          description: Läuft die Beta-Phase (neue Konten werden als Beta-Tester markiert)?
        terms_version:
          type: string
          nullable: true
          description: Gültige Fassung der Nutzungsbedingungen (TERMS_VERSION, #135); null = keine Zustimmung nötig
      required: [status, timestamp, service, version]

    DbPingResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        result:
          type: object
          additionalProperties: true
      required: [ok]

    WhoAmIResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        username:
          type: string
          nullable: true
        mfa_enabled:
          type: boolean
        profile_image_url:
          type: string
          nullable: true
        beta_tester:
          type: boolean
        email_verified:
          type: boolean
        pending_email:
          type: string
          nullable: true
        unverified_limits:
          type: object
          nullable: true
          description: "Grenzen ohne bestätigte Adresse (#135), z. B. { maxVehicles: 1, maxEntries: 1 }; null, wenn bestätigt"
          additionalProperties: { type: integer }
        pending_invitations:
          type: integer
          description: Offene Einladungen zu geteilten Fahrzeugen (#53)
        terms:
          type: object
          description: Nutzungsbedingungen (#135); required = der gültigen Fassung noch nicht zugestimmt
          properties:
            version: { type: string, nullable: true }
            accepted_version: { type: string, nullable: true }
            accepted_at: { type: string, format: date-time, nullable: true }
            required: { type: boolean }
        is_admin:
          type: boolean
          description: true, wenn die User-ID in ADMIN_USER_IDS steht
        plan:
          type: string
          enum: [free, plus, fleet]
          description: Gebuchter Tarif
        planUntil:
          type: string
          format: date-time
          nullable: true
          description: Ende des Tarifs, null = unbefristet. Danach gilt free.
        effectivePlan:
          type: string
          enum: [free, plus, fleet]
          description: Tarif, dessen Rechte gerade gelten (ohne PLAN_LIMITS_ENABLED mindestens plus)
        limitsEnabled:
          type: boolean
          description: Werden Tarifgrenzen durchgesetzt (PLAN_LIMITS_ENABLED)?
        features:
          type: object
          description: "Rechte des geltenden Tarifs: maxVehicles und tripCategories (Zahl oder null = unbegrenzt), sharing, comparison, pdfReport, pushReminders, fleet (boolean)"
          additionalProperties: true
        token:
          type: object
          additionalProperties: false
          properties:
            jti:
              type: string
              nullable: true
            iat:
              type: string
              format: date-time
              nullable: true
            exp:
              type: string
              format: date-time
              nullable: true
      required: [id, email]

    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        acceptTerms:
          type: boolean
          description: Zustimmung zu den Nutzungsbedingungen (#135); zusammen mit termsVersion
        termsVersion:
          type: string
          description: Fassung aus GET /health (terms_version). Ohne Zustimmung wird sie nach der Anmeldung nachgeholt.
        device:
          $ref: "#/components/schemas/DeviceInfo"
      required: [email, password]

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        code:
          type: string
          example: "123456"
          description: "6-stelliger TOTP-Code. Nur bei aktiver 2FA nötig (fehlt er, kommt 401 mfa_required); ohne aktive 2FA wird er ignoriert."
        device:
          $ref: "#/components/schemas/DeviceInfo"
      required: [email, password]

    AuthResponse:
      type: object
      additionalProperties: false
