    parameters:
      - $ref: "#/components/parameters/VehicleId"
      - name: userId
        in: path
        required: true
        description: "Konto-ID des Mitglieds; beim Entfernen auch \"me\" (Fahrzeug selbst verlassen)"
        schema: { type: string }
    patch:
      tags: [Sharing]
      summary: Change a member's role (owner only)
      operationId: patchVehicleMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [editor, viewer] }
              required: [role]
      responses:
        "200":
          description: "OK ({ user_id, role })"
        "400":
          description: invalid_role
        "403":
          description: owner_only
        "404":
          description: vehicle_not_found | member_not_found
    delete:
      tags: [Sharing]
      summary: Remove a member (owner) or leave the vehicle (member, userId = me)
      description: "Einträge des Mitglieds bleiben beim Fahrzeug."
      operationId: deleteVehicleMember
      responses:
        "204":
          description: No Content
        "400":
          description: owner_cannot_leave
        "403":
          description: owner_only
        "404":
          description: vehicle_not_found | member_not_found

  /api/v1/vehicles/{vehicleId}/invitations:
    post:
      tags: [Sharing]
      summary: Invite an e-mail address to the vehicle (owner only, plan feature sharing, confirmed e-mail)
      description: >
        Die Einladung gilt 14 Tage und lässt sich nur mit genau dieser, bestätigten Adresse annehmen. Eine offene
        Einladung an dieselbe Adresse wird ersetzt. Mit Standard-Mailserver geht eine Mail raus (mailed).
        Höchstens 10 Mitglieder je Fahrzeug und 20 Einladungen je Tag.
      operationId: postVehicleInvitation
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [editor, viewer], default: editor, description: "editor = Mitfahrer (sehen und erfassen), viewer = nur ansehen" }
              required: [email]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VehicleInvitation"
                  - type: object
                    properties:
                      mailed: { type: boolean }
        "400":
          description: invalid_email | invalid_role | cannot_invite_self
        "403":
          description: owner_only | plan_required (feature sharing) | email_not_verified
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: already_member | member_limit_reached
        "429":
          description: too_many_invitations

