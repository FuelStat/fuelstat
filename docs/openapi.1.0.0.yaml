        refreshToken:
          type: string
          description: "Nur mit device: einmal verwendbar, gegen ein neues Paar tauschen über POST /auth/session/refresh. Sicher speichern (Keychain)."
        expiresIn:
          type: integer
          description: "Nur mit device: Laufzeit des Zugriffstokens in Sekunden (1800)"
          example: 1800
        session:
          $ref: "#/components/schemas/DeviceSession"
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

