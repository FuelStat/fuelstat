    delete:
      tags: [Sharing]
      summary: Withdraw an open invitation (owner only)
      operationId: deleteVehicleInvitation
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: No Content
        "403":
          description: owner_only
        "404":
          description: vehicle_not_found | invitation_not_found

