  /api/v1/vehicles/{vehicleId}/import:
    post:
      tags: [Entries]
      summary: Import fillups and entries (e.g. from CSV)
      description: "Max. 1000 Zeilen, alles in einer Transaktion. Duplikate (gleiches Datum + Tachostand + Einheit bzw. Datum + Kategorie + Betrag) werden übersprungen. `unit` je Zeile gilt nur bei Plug-in-Hybriden (l oder kwh); sonst immer die Einheit des Fahrzeugs."
      operationId: postVehicleImport
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fillups:
                  type: array
                  items:
                    $ref: "#/components/schemas/FillupCreateRequest"
                entries:
                  type: array
                  items:
                    $ref: "#/components/schemas/EntryCreateRequest"
                dryRun:
                  type: boolean
                  description: Nur prüfen, nichts speichern (Antwort 200 mit Duplikaten und Warnungen)
      responses:
        "200":
          description: "Probelauf (dryRun): gleiche Felder wie 201 plus dryRun: true"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: object
                    properties:
                      fillups: { type: integer }
                      entries: { type: integer }
                  skipped:
                    type: object
                    properties:
                      fillups: { type: integer }
                      entries: { type: integer }
                  duplicates:
                    type: array
                    description: Übersprungene Zeilen (type fillup|entry, index in der jeweiligen Liste)
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        index: { type: integer }
                  warnings:
                    type: array
                    description: Unplausible Tachostände je Zeile (type, index und die Felder von OdometerWarning)
                    items:
                      type: object
        "400":
          description: nothing_to_import | too_many_rows | invalid_rows
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/vehicles/{vehicleId}/reminders:
    get:
      tags: [Vehicles]
      summary: Due dates (TÜV, service, insurance, tax)
      operationId: getVehicleReminders
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/mail-settings:
    get:
      tags: [Users]
      summary: Get own e-mail notification settings
      operationId: getMailSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      summary: Save own e-mail notification settings
      operationId: putMailSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailSettingsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailSettings"
        "400":
          description: invalid_* | mail_not_configured | smtp_host_not_allowed | smtp_host_not_found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/mail-settings/test:
    post:
      tags: [Users]
      summary: Send a test mail with the saved settings
      operationId: postMailTest
      responses:
        "200":
          description: OK
        "400":
          description: mail_not_configured | smtp_host_not_allowed | smtp_host_not_found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: smtp_failed (detail enthält die Meldung des Mailservers)

  /api/v1/auth/mail-settings/send-now:
    post:
      tags: [Users]
