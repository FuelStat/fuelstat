        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/entries/{entryId}:
