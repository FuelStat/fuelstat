openapi: 3.0.3
info:
  title: Fuelstat API
  version: "1.0.0"
  description: >
    Fuelstat Backend API (v1): selbst gehostete Fahrzeugverwaltung für Tanken, Laden, Wartung und laufende Kosten.
    Verbrauch, Kosten, CO₂ und Termine rechnet die API; Web-App und Apps stellen nur dar.
    Änderungen unter /api/v1 sind abwärtskompatibel (neue Felder können dazukommen, Clients ignorieren unbekannte Felder).
    Ausführliche Regeln: docs/api.md im Repository.
  contact:
    name: Mario Caraggiu
    url: https://tanken.1emc.de/pages/impressum.php
  license:
    name: AGPL-3.0
    url: https://github.com/FuelStat/fuelstat/blob/main/LICENSE
servers:
  - url: https://tanken.1emc.de
    description: Produktivinstanz

tags:
  - name: Health
  - name: Auth
  - name: Tokens
  - name: Users
  - name: Vehicles
  - name: Fillups
  - name: Stats
  - name: Entries
  - name: Feedback
  - name: Media
  - name: Stations
  - name: Sharing
    description: Fahrzeuge mit anderen Konten teilen (#53)
  - name: Trips
    description: Fahrtenbuch (#52)

security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: healthy
                timestamp: "2025-12-23T13:47:17.641Z"
                service: fuelstat-api-v2
                version: "0.10.0"
                registration_enabled: true
                beta_phase: true

  /api/v1/db-ping:
    get:
      tags: [Health]
      summary: Health DB
      operationId: getDbPing
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DbPingResponse"
              example:
                ok: true
                result:
                  ok: 1
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/whoami:
    get:
      tags: [Health]
      summary: Health whoami
      description: Gibt den eingeloggten User aus dem JWT zurück.
      operationId: getWhoAmI
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmIResponse"
              example:
                id: "97f6407a-b317-4715-ae74-f03885125c88"
                email: "mario@test.local"
                created_at: "2025-01-01T12:34:56.000Z"
                token:
                  jti: "c7b1c65a-9f4c-4f0e-9d62-..."
                  iat: "2025-12-23T08:34:47.135Z"
                  exp: "2025-12-30T08:34:47.135Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: User Register
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: "mario@test.local"
              password: "SuperSecret123!"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  id: "97f6407a-b317-4715-ae74-f03885125c88"
                  email: "mario@test.local"
                  username: null
                  mfa_enabled: false
                  profile_image_url: null
                  beta_tester: true
                  created_at: "2025-12-23T08:34:47.135Z"
                  updated_at: "2025-12-23T08:34:47.135Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Conflict (email_already_exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email_already_exists
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: User Login
      operationId: postAuthLogin
      security: []
      description: >
        Anmelden mit E-Mail und Passwort. Bei aktiver 2FA gibt es zwei Wege: `code` gleich mitschicken (ein Schritt)
        oder ohne `code` anfragen, 401 `mfa_required` mit `mfaToken` erhalten und den Code an POST /api/v1/auth/login/mfa
        schicken (zwei Schritte). Ohne aktive 2FA wird `code` ignoriert. Jeder Code gilt nur einmal.
        Sperre nach 10 Fehlversuchen je IP und E-Mail bzw. 50 je IP für 15 Minuten (429), nach 5 falschen Codes je Konto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              ohne2fa:
                summary: Konto ohne 2FA
                value:
                  email: "mario@test.local"
                  password: "SuperSecret123!"
              mit2fa:
                summary: Konto mit 2FA, Code in einem Schritt
                value:
                  email: "mario@test.local"
                  password: "SuperSecret123!"
                  code: "123456"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: missing_credentials (E-Mail oder Passwort fehlt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: missing_credentials
        "401":
          description: "invalid_credentials | mfa_required (mit mfaToken, 5 Minuten gültig) | invalid_mfa_code (falsch, abgelaufen oder schon verwendet)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginErrorResponse"
              examples:
                falschesPasswort:
                  summary: E-Mail oder Passwort falsch
                  value:
                    error: invalid_credentials
                codeNoetig:
                  summary: 2FA aktiv, kein Code mitgeschickt
                  value:
                    error: mfa_required
                    mfaToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                falscherCode:
                  summary: Code falsch, abgelaufen oder schon verwendet
                  value:
                    error: invalid_mfa_code
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: Login step 2 with 2FA code
      description: "mfaToken aus der mfa_required-Antwort von /auth/login (5 Minuten gültig) plus TOTP-Code."
      operationId: postAuthLoginMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaToken: { type: string }
                code: { type: string, example: "123456" }
                device:
                  $ref: "#/components/schemas/DeviceInfo"
              required: [mfaToken, code]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: invalid_mfa_token (fehlt, falsch oder älter als 5 Minuten) | invalid_mfa_code (falsch, abgelaufen oder schon verwendet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: invalid_mfa_code
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm the e-mail address with the token from the mail (#135)
      description: >
        Ohne Anmeldung, das Token aus der Mail ist der Nachweis. Gilt 24 Stunden und nur einmal. Bestätigt die
        Konto-Adresse bzw. übernimmt eine ausstehende neue Adresse (pending_email).
      operationId: postVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, example: true }
                  email: { type: string, format: email }
        "400":
          description: invalid_token (falsch oder schon benutzt) | token_expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: email_already_exists (die neue Adresse gehört inzwischen einem anderen Konto)

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send the confirmation mail again (#135)
      description: "An die ausstehende neue Adresse, sonst an die Konto-Adresse. Frühestens 60 Sekunden nach der letzten Mail, höchstens 5 je 24 Stunden."
      operationId: postResendVerification
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  email: { type: string, format: email }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: already_verified
        "429":
          description: "resend_too_soon (retry_after_seconds) | too_many_attempts"
        "502":
          description: smtp_failed
        "503":
          description: mail_not_configured

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link (#141)
      description: >
        Antwort immer 202 und sofort – auch wenn es kein Konto mit der Adresse gibt (verrät keine Konten). Gibt es das
        Konto, geht ein Link an die Konto-Adresse ({APP_URL}/pages/passwort_zuruecksetzen.php?token=…, ohne APP_URL
        nur der Code), 1 Stunde gültig, nur einmal. Höchstens 3 Mails je Konto und Stunde, 10 Anfragen je IP in 15 Minuten.
      operationId: postForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "202":
          description: Angenommen
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, example: true }
        "400":
          description: invalid_email
        "429":
          description: too_many_requests
        "503":
          description: mail_not_configured (kein Standard-Mailserver)

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with the token from the mail (#141)
      description: >
        Setzt das Passwort, meldet auf allen Geräten ab (alle bisherigen Tokens ungültig) und bestätigt die E-Mail-Adresse.
        Eine aktive 2FA bleibt aktiv.
      operationId: postResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
              required: [token, password]
      responses:
        "200":
          description: "OK ({ reset: true })"
        "400":
          description: invalid_token (falsch oder schon benutzt) | token_expired | password_too_short

  /api/v1/auth/accept-terms:
    post:
      tags: [Auth]
      summary: Accept the current terms of use (#135)
      description: "version = gültige Fassung aus GET /health (terms_version) bzw. /whoami (terms.version)."
      operationId: postAcceptTerms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: string, example: "2026-11-09" }
              required: [version]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted_version: { type: string }
                  accepted_at: { type: string, format: date-time }
        "400":
          description: invalid_terms_version (current = gültige Fassung)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: terms_not_configured (TERMS_VERSION leer)

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renew the login token (7 days), at most 90 days after the last password login
      operationId: postAuthRefresh
      responses:
        "200":
          description: "OK ({ token })"
        "400":
          description: "use_session_refresh: Token einer Gerätesitzung (Apps verlängern über POST /auth/session/refresh)"
        "401":
          description: "missing_token, invalid_token, token_revoked oder reauth_required (letzter Login mit Passwort > 90 Tage)"

  /api/v1/auth/session/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token of a device session for a new token pair (#117)
      description: >
        Ohne Bearer-Token. Jedes Refresh-Token gilt genau einmal (Rotation). Kommt ein schon getauschtes Token später
        noch einmal, wird die ganze Gerätesitzung beendet (refresh_token_reused). Innerhalb von 30 Sekunden nach dem
        Tausch (zwei gleichzeitige Anfragen derselben App) gibt es nur refresh_token_already_used, die Sitzung bleibt;
        Clients tauschen deshalb nie parallel. Eine Sitzung endet nach 180 Tagen ohne Tausch.
      operationId: postAuthSessionRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken: { type: string }
                appVersion: { type: string, maxLength: 30, description: "Optional: aktuelle App-Version für die Geräteliste" }
              required: [refreshToken]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer, example: 1800 }
                required: [token, refreshToken, expiresIn]
        "400":
          description: missing_refresh_token
        "401":
          description: "invalid_refresh_token | refresh_token_already_used | refresh_token_reused (Sitzung beendet) | session_revoked | session_expired – außer bei already_used neu anmelden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: too_many_requests

  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: Own active device sessions (apps), most recently used first (#117)
      operationId: getAuthSessions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Eine Seite (#160)
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceSession"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Sign out one device (own session); "current" = the session of this token (#117)
      operationId: deleteAuthSession
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string }, description: "UUID der Sitzung oder current" }
      responses:
        "204":
          description: Abgemeldet; Zugriffs- und Refresh-Token des Geräts gelten sofort nicht mehr
        "400":
          description: "no_device_session (current ohne Gerätesitzung, z. B. Web-App)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: session_not_found

  /api/v1/auth/password:
    post:
      tags: [Users]
      summary: Change own password
      description: "Prüft das aktuelle Passwort, setzt das neue, widerruft alle bestehenden Tokens und Gerätesitzungen und gibt ein neues Token zurück. Aus einer App (Token mit Gerätesitzung) kommt eine neue Gerätesitzung mit refreshToken, expiresIn und session (#117)."
      operationId: postAuthPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                  session:
                    $ref: "#/components/schemas/DeviceSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/mfa/setup:
    post:
      tags: [Users]
      summary: Start 2FA setup (TOTP)
      description: "Erzeugt ein neues Secret. 2FA ist erst nach /auth/mfa/enable aktiv."
      operationId: postMfaSetup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: mfa_already_enabled
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/mfa/enable:
    post:
      tags: [Users]
      summary: Enable 2FA with a code from the authenticator app
      operationId: postMfaEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "200":
          description: OK
        "400":
          description: invalid_mfa_code | mfa_not_set_up
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/mfa/disable:
    post:
      tags: [Users]
      summary: Disable 2FA (password and current code required)
      operationId: postMfaDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "200":
          description: OK
        "400":
          description: invalid_mfa_code | mfa_not_enabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/tokens/revoke:
    post:
      tags: [Tokens]
      summary: Revoke Login Token
      operationId: postAuthTokensRevoke
      description: "Eigene Tokens kann jeder widerrufen, fremde nur Admins (ADMIN_USER_IDS)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTokenRequest"
            example:
              token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              reason: "lost"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTokenResponse"
              example:
                jti: "e253e319-17ae-4378-b68e-b07784cd4f39"
                userId: "46c597e1-0f50-4bd7-a02b-088c91842c76"
                reason: "lost"
                message: "Token wurde widerrufen und wird ab sofort abgelehnt."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/tokens:
    get:
      tags: [Tokens]
      summary: Get revoked Login Tokens (list)
      operationId: getAuthTokens
      description: "Admins sehen alle widerrufenen Tokens (optional gefiltert per userId), alle anderen nur ihre eigenen; userId wird dann ignoriert."
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter tokens by user ID
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RevokedToken"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
              example:
                - jti: "e253e319-17ae-4378-b68e-b07784cd4f39"
                  user_id: "46c597e1-0f50-4bd7-a02b-088c91842c76"
                  reason: "lost"
                  revoked_at: "2025-12-23T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/users/{userId}/revoke-all:
    post:
      tags: [Tokens, Users]
      summary: Revoke all Tokens of User
      operationId: postAuthUsersRevokeAll
      description: "Nur für den eigenen User oder Admins (ADMIN_USER_IDS). Beendet auch alle Gerätesitzungen der Apps (#117)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllTokensRequest"
            example:
              reason: "reset"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllTokensResponse"
              example:
                userId: "46c597e1-0f50-4bd7-a02b-088c91842c76"
                revokedAfter: "2025-12-23T12:00:00.000Z"
                reason: "reset"
                message: "Alle bestehenden Tokens dieses Benutzers wurden widerrufen. Neue Logins erhalten wieder gültige Tokens."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/users:
    get:
      tags: [Users]
      summary: Get Users (list)
      operationId: getUsers
      description: "Nur für Admins (ADMIN_USER_IDS)."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
              example:
                - id: "97f6407a-b317-4715-ae74-f03885125c88"
                  email: "mario@test.local"
                  created_at: "2025-01-01T12:34:56.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/users/{userId}:
    get:
      tags: [Users]
      summary: Get User (details)
      operationId: getUser
      description: "Nur für den eigenen User oder Admins (ADMIN_USER_IDS)."
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
