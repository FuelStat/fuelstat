<!doctype html>
<!-- Fehlerseite für 500, 502, 503 und 504 (#211, docs/design.md 8.1). nginx zeigt sie, wenn PHP oder die API gerade
     nicht antworten (error_page in infra/nginx/fuelstat.conf.example). Deshalb ohne PHP, ohne Skripte und ohne weitere
     Dateien: Farben und Schrift sind die Tokens aus docs/design.md, hier fest eingetragen. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gerade nicht erreichbar – Fuelstat</title>
<style>
  :root {
    --fs-brand: #0A717A; --fs-on-brand: #FFFFFF; --fs-background: #F2F6F8; --fs-card: #FFFFFF; --fs-card-tint: #E2F1F2;
    --fs-text: #14202E; --fs-text-secondary: #4A5868; --fs-radius-card: 1.25rem; --fs-radius-capsule: 50rem;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fs-brand: #5ED3CF; --fs-on-brand: #0A1C33; --fs-background: #0E1624; --fs-card: #1A2230; --fs-card-tint: #22303A;
      --fs-text: #E6EDF5; --fs-text-secondary: #A3B1C2; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--fs-background);
    color: var(--fs-text); font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 1rem 1.25rem; font-weight: 700; font-size: 1.0625rem; }
  main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 1.5rem 1rem; }
  .karte { max-width: 36rem; width: 100%; background: var(--fs-card); border-radius: var(--fs-radius-card);
    padding: 2.5rem 1.5rem; text-align: center; }
  .symbol { width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 50%; background: var(--fs-card-tint);
    color: var(--fs-brand); display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 1.375rem; line-height: 1.2; margin: 0 0 .5rem; }
  p { color: var(--fs-text-secondary); margin: 0 0 1.5rem; }
  a.knopf { display: inline-block; min-height: 44px; padding: .625rem 1.5rem; border-radius: var(--fs-radius-capsule);
    background: var(--fs-brand); color: var(--fs-on-brand); font-weight: 600; text-decoration: none; }
  a.knopf:focus-visible { outline: 3px solid var(--fs-text); outline-offset: 2px; }
</style>
</head>
<body>
<header>Fuelstat</header>
<main>
  <div class="karte">
    <div class="symbol" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </div>
    <h1>Gerade nicht erreichbar</h1>
    <p>Das hat gerade nicht geklappt. Versuche es gleich noch einmal.</p>
    <a class="knopf" href="">Erneut versuchen</a>
  </div>
</main>
</body>
</html>
