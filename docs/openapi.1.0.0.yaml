        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [reminders, report]
              required: [type]
      responses:
        "200":
          description: "OK ({ sent: true } oder { sent: false, reason: nothing_due })"
        "400":
          description: invalid_type | mail_not_configured
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: smtp_failed

  /api/v1/auth/users/{userId}/beta:
    put:
      tags: [Users]
      summary: Set beta tester flag (admin only)
      operationId: putUserBeta
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                betaTester:
                  type: boolean
              required: [betaTester]
      responses:
        "200":
          description: "OK ({ id, email, beta_tester })"
        "400":
          description: invalid_betaTester
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden
        "404":
          description: user_not_found

  /api/v1/auth/plans:
    put:
      tags: [Users]
      summary: Set plan for several users (admin only)
      operationId: putPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    format: uuid
                plan:
                  type: string
                  enum: [free, plus, fleet]
                planUntil:
                  type: string
                  format: date-time
                  nullable: true
                  description: Ende des Tarifs, leer/null = unbefristet (bei free immer null)
                note:
                  type: string
                  maxLength: 200
                  description: Notiz fürs Protokoll der Tarifänderungen
              required: [userIds, plan]
      responses:
        "200":
          description: "OK ({ updated, changed, plan, planUntil }); updated = gefundene Konten, changed = davon geändert"
        "400":
          description: invalid_plan, invalid_planUntil, invalid_userIds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden

  /api/v1/auth/users/{userId}/plan:
    put:
      tags: [Users]
      summary: Set plan (admin only)
      operationId: putUserPlan
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum: [free, plus, fleet]
                planUntil:
                  type: string
                  format: date-time
                  nullable: true
                  description: Ende des Tarifs, leer/null = unbefristet (bei free immer null)
                note:
                  type: string
                  maxLength: 200
                  description: Notiz fürs Protokoll der Tarifänderungen
              required: [plan]
      responses:
        "200":
          description: "OK ({ id, email, plan, planUntil, effectivePlan, limitsEnabled, features })"
        "400":
          description: invalid_plan, invalid_planUntil
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden
        "404":
          description: user_not_found

  /api/v1/auth/users/{userId}/plan-history:
    get:
      tags: [Users]
      summary: Plan change history of a user (admin only)
      operationId: getUserPlanHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK, neueste Änderung zuerst, höchstens 50
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        oldPlan: { type: string, enum: [free, plus, fleet] }
                        oldPlanUntil: { type: string, format: date-time, nullable: true }
                        newPlan: { type: string, enum: [free, plus, fleet] }
                        newPlanUntil: { type: string, format: date-time, nullable: true }
                        source: { type: string, enum: [admin, cli, webhook] }
                        changedBy: { type: string, format: uuid, nullable: true }
                        note: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden
        "404":
          description: user_not_found

  /api/v1/feedback:
    post:
      tags: [Feedback]
      summary: Send feedback (stored and mailed to the operator)
      operationId: postFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  enum: [fehler, idee, lob, sonstiges]
                message:
                  type: string
                  minLength: 3
                  maxLength: 5000
                page:
                  type: string
                  maxLength: 300
                  description: Seite, von der das Feedback kommt
              required: [category, message]
      responses:
        "201":
          description: "Gespeichert ({ id, saved: true, mailed })"
        "400":
          description: invalid_category | invalid_message | invalid_page
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: too_many_attempts (höchstens 10 je 15 Minuten)
    get:
      tags: [Feedback]
      summary: List feedback (admin only, open first)
      operationId: getFeedback
      responses:
        "200":
          description: "Liste mit id, category, message, page, user_agent, done, created_at, user_email, username, beta_tester"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden

  /api/v1/feedback/{id}:
    patch:
      tags: [Feedback]
      summary: Mark feedback as done or open (admin only)
      operationId: patchFeedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                done:
                  type: boolean
              required: [done]
      responses:
        "200":
          description: "OK ({ id, done })"
        "400":
          description: invalid_done
        "403":
          description: forbidden
        "404":
          description: feedback_not_found

  /api/v1/categories:
    get:
      tags: [Entries]
      summary: Categories for expenses (built-in, premium, custom, legacy)
      description: >
        Liefert groups, categories (key, name, icon, color, group, form, countsAsCost, plan, custom, selectable, available)
        und custom (max, used, canCreate, icons, colors, nameMaxLength). Cache-Control private, max-age=300; ETag.
      operationId: getCategories
      responses:
        "200":
          description: OK
        "304":
          description: Not Modified (If-None-Match)
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Entries]
      summary: Create a custom category (plan feature customCategories)
      operationId: postCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
                icon: { type: string, example: "fa-ferry" }
                color: { type: string, example: "#0dcaf0" }
                group: { type: string, enum: [fix, wartung, unterwegs, sonstiges] }
      responses:
        "201":
          description: Created (key custom:<id>)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: plan_required oder category_limit_reached
        "409":
          description: name_taken

  /api/v1/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Entries]
      summary: Change a custom category (name, icon, color, group)
      operationId: patchCategory
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: name_taken
    delete:
      tags: [Entries]
      summary: Delete a custom category; entries move to moveTo
      operationId: deleteCategory
      parameters:
        - name: moveTo
          in: query
          required: false
          schema: { type: string, example: "Sonstiges" }
      responses:
        "200":
          description: "OK ({ deleted, moved, moveTo })"
        "400":
          description: invalid_moveTo
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: category_in_use (moveTo fehlt)

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renew the login token (7 days), at most 90 days after the last password login
      operationId: postAuthRefresh
      responses:
        "200":
          description: "OK ({ token })"
        "401":
          description: "missing_token, invalid_token, token_revoked oder reauth_required (letzter Login mit Passwort > 90 Tage)"

  /api/v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: Login step 2 with 2FA code
      description: "mfaToken aus der mfa_required-Antwort von /auth/login (5 Minuten gültig) plus TOTP-Code."
      operationId: postAuthLoginMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaToken: { type: string }
                code: { type: string, example: "123456" }
              required: [mfaToken, code]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: invalid_mfa_token | invalid_mfa_code
        "429":
          description: too_many_attempts

  /api/v1/stations:
    get:
      tags: [Stations]
      summary: Nearby fuel stations with current prices (Tankerkönig, CC BY 4.0)
      description: "Nach Entfernung sortiert, 2 Minuten gecacht, 30 Abfragen pro Minute und Konto. Die Quelle Tankerkönig muss angezeigt werden."
      operationId: getStations
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius, in: query, required: false, schema: { type: number, minimum: 1, maximum: 25, default: 5 } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [e5, e10, diesel, all], default: all } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        brand: { type: string, nullable: true }
                        street: { type: string, nullable: true }
                        houseNumber: { type: string, nullable: true }
                        postCode: { type: string, nullable: true }
                        place: { type: string, nullable: true }
                        lat: { type: number }
                        lng: { type: number }
                        distanceKm: { type: number, nullable: true }
                        isOpen: { type: boolean }
                        prices:
                          type: object
                          description: "Preis je Sorte in EUR/l, null wenn nicht angeboten; bei type=all e5, e10 und diesel"
                          additionalProperties: { type: number, nullable: true }
                      required: [id, name, lat, lng, isOpen, prices]
                  source: { type: string, example: Tankerkönig }
                  license: { type: string, example: CC BY 4.0 }
                  sourceUrl: { type: string }
                required: [stations]
        "400":
          description: invalid_coordinates | invalid_radius
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: too_many_requests
        "502":
          description: stations_unavailable (Tankerkönig nicht erreichbar)
        "503":
          description: stations_not_configured (TANKERKOENIG_API_KEY fehlt)

  /api/v1/charging-stations:
    get:
      tags: [Stations]
      summary: Nearby charging stations (Open Charge Map, CC BY 4.0)
      description: "Nach Entfernung sortiert, höchstens 30 Treffer, 6 Stunden gecacht, 30 Abfragen pro Minute und Konto. Die Quelle Open Charge Map muss angezeigt werden."
      operationId: getChargingStations
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius, in: query, required: false, schema: { type: number, minimum: 1, maximum: 25, default: 5 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, nullable: true }
                        name: { type: string }
                        operator: { type: string, nullable: true }
                        street: { type: string, nullable: true }
                        place: { type: string, nullable: true }
                        postCode: { type: string, nullable: true }
                        lat: { type: number, nullable: true }
                        lng: { type: number, nullable: true }
                        distanceKm: { type: number, nullable: true }
                        points: { type: integer, nullable: true, description: Anzahl Ladepunkte }
                        maxKw: { type: number, nullable: true, description: Höchste Ladeleistung in kW }
                        connectors: { type: array, items: { type: string }, description: "Steckertypen, z. B. CCS, Typ 2" }
                        usageCost: { type: string, nullable: true, description: Kostenhinweis des Betreibers (Freitext) }
                        isOperational: { type: boolean }
                      required: [name, connectors, isOperational]
                  source: { type: string, example: Open Charge Map }
                  license: { type: string, example: CC BY 4.0 }
                  sourceUrl: { type: string }
                required: [stations]
        "400":
          description: invalid_coordinates | invalid_radius
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: too_many_requests
        "502":
          description: charging_stations_unavailable (Open Charge Map nicht erreichbar)
        "503":
          description: charging_stations_not_configured (OCM_API_KEY fehlt)

  /api/v1/media/upload:
    post:
      tags: [Media]
      summary: Upload profile image
      description: "multipart/form-data mit Feld `file`, max. 20 MB, nur JPEG/PNG/GIF/WebP (Inhalt wird geprüft). Danach `PATCH /api/v1/auth/users/{userId}` mit `profileImageUrl`."
      operationId: uploadUserMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: missing_file | invalid_image
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/files/{name}:
    get:
      tags: [Media]
      summary: Signed image download (no login; URL comes from API responses)
      description: >
        Bilder sind nur über signierte Adressen abrufbar, die die API in url, image_url und profile_image_url liefert.
        Gültig bis Ende des nächsten Tages (UTC), Cache-Control private.
      operationId: getFile
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, example: "3f2c0d1e-0000-4000-8000-000000000000.webp" } }
        - { name: exp, in: query, required: true, schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Bild (image/webp)
        "404":
          description: Unbekannt, falsche Signatur oder abgelaufen

  /api/v1/media:
    get:
      tags: [Media]
      summary: List own uploaded images
      operationId: listUserMedia
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Media]
      summary: Get own image
      operationId: getUserMedia
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Media]
      summary: Delete own image
      operationId: deleteUserMedia
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/media/upload:
    post:
      tags: [Media]
      summary: Upload vehicle image
      description: "multipart/form-data mit Feld `file`, wie beim Profilbild. Danach `PATCH /api/v1/vehicles/{vehicleId}` mit `imageUrl`."
      operationId: uploadVehicleMedia
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          description: missing_file | invalid_image
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/media:
    get:
      tags: [Media]
      summary: List vehicle images
      operationId: listVehicleMedia
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vehicles/{vehicleId}/media/{mediaId}:
    delete:
      tags: [Media]
      summary: Delete vehicle image
      operationId: deleteVehicleMedia
      parameters:
        - $ref: "#/components/parameters/VehicleId"
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FillupId:
      name: fillupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Anzahl zu überspringender Einträge (für seitenweises Laden)
      schema:
        type: integer
        minimum: 0
        default: 0
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_request
            detail: "Validation failed"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: forbidden
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid_token
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not_found
    ServerError:
      description: Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: server_error
            detail: "Unexpected error"

  schemas:
    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid, description: nur bei Fahrzeugbildern }
        media_type: { type: string, example: image }
        url: { type: string, example: /uploads/3f9c….jpg }
        mime_type: { type: string, example: image/jpeg }
        bytes: { type: integer }
        created_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        detail:
          type: string
          nullable: true
      required: [error]

    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [healthy]
        timestamp:
          type: string
          format: date-time
        service:
          type: string
      required: [status, timestamp, service]

    DbPingResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        result:
          type: object
          additionalProperties: true
      required: [ok]

    WhoAmIResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        username:
          type: string
          nullable: true
        mfa_enabled:
          type: boolean
        profile_image_url:
          type: string
          nullable: true
        is_admin:
          type: boolean
          description: true, wenn die User-ID in ADMIN_USER_IDS steht
        plan:
          type: string
          enum: [free, plus, fleet]
          description: Gebuchter Tarif
        planUntil:
          type: string
          format: date-time
          nullable: true
          description: Ende des Tarifs, null = unbefristet. Danach gilt free.
        effectivePlan:
          type: string
          enum: [free, plus, fleet]
          description: Tarif, dessen Rechte gerade gelten (ohne PLAN_LIMITS_ENABLED mindestens plus)
        limitsEnabled:
          type: boolean
          description: Werden Tarifgrenzen durchgesetzt (PLAN_LIMITS_ENABLED)?
        features:
          type: object
          description: "Rechte des geltenden Tarifs: maxVehicles und tripCategories (Zahl oder null = unbegrenzt), sharing, comparison, pdfReport, pushReminders, fleet (boolean)"
          additionalProperties: true
        token:
          type: object
          additionalProperties: false
          properties:
            jti:
              type: string
              nullable: true
            iat:
              type: string
              format: date-time
              nullable: true
            exp:
              type: string
              format: date-time
              nullable: true
      required: [id, email]

    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        code:
          type: string
          description: "6-stelliger TOTP-Code; nur nötig, wenn 2FA aktiv ist (sonst 401 mfa_required)"
      required: [email, password]

    AuthResponse:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [id, email]

    UserPatchRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email


    VehicleFuelType:
      type: string
      description: Kraftstoffart des Fahrzeugs. hybrid = Vollhybrid (tankt nur), phev = Plug-in-Hybrid (tankt und lädt).
      enum: [diesel, e5, e10, lpg, cng, electric, hybrid, phev, hydrogen, other]

